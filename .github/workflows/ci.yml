name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -e ".[test]"

      - name: Build distribution package
        run: python -m build

      - name: Verify package imports
        run: python -c "import rental.models, rental.service, rental.repositories"

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit tests
        run: |
          mkdir -p reports
          pytest tests/test_unit.py -v --junitxml=reports/unit-test-results.xml

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/unit-test-results.xml

  integration-and-api-tests:
    name: Integration & API Tests
    needs: unit-tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rental_variant12_test
          POSTGRES_USER: rental_student
          POSTGRES_PASSWORD: "12345"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rental_student -d rental_variant12_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: rental_variant12_test
      DB_USER: rental_student
      DB_PASSWORD: "12345"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" fastapi uvicorn requests python-dotenv

      - name: Apply database migrations
        run: |
          python -c "import os, pathlib, psycopg; sql = pathlib.Path('migrations/V1__create_tables.sql').read_text(encoding='utf-8'); conn = psycopg.connect(host=os.environ['DB_HOST'], port=os.environ['DB_PORT'], dbname=os.environ['DB_NAME'], user=os.environ['DB_USER'], password=os.environ['DB_PASSWORD'], autocommit=True); conn.execute(sql); conn.close()"

      - name: Start FastAPI server in background
        run: |
          nohup uvicorn rental.api:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/docs > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat api.log
          exit 1

      - name: Run integration and API tests
        run: |
          mkdir -p reports
          pytest tests/test_environment.py tests/test_repository_integration.py tests/test_service_integration.py tests/test_rest_api.py -v --junitxml=reports/integration-api-test-results.xml

      - name: Upload integration & API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-api-test-report
          path: |
            reports/integration-api-test-results.xml
            api.log
